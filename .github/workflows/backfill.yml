name: Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days of history to backfill"
        required: false
        default: "60"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: src
        run: python backfill.py --days ${{ github.event.inputs.days }}
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          CITY_NAME: ${{ vars.CITY_NAME || 'Peshawar' }}
          FEATURE_STORE_BACKEND: hopsworks
